services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: gevora
      POSTGRES_USER: gevora
      POSTGRES_PASSWORD: gevora
    ports:
      - "5432:5432"
    volumes:
      - gevora-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - gevora-elasticsearch:/usr/share/elasticsearch/data

volumes:
  gevora-postgres:
  gevora-elasticsearch:
